[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-balance-cli"
version = "0.1.1"
description = "Split a symmetric contact tensor into a bias vector, bias matrix, and balanced residual tensor."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12"]

[project.scripts]
tensor-balance = "tensorbalance.cli:main"
tensor-export-csv = "tensorbalance.export_csv:main"

[tool.setuptools.packages.find]
include = ["tensorbalance*"]

[tool.setuptools.package-data]
tensorbalance = ["view.html"]
